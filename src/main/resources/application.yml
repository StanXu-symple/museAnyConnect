server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
  tomcat:
    threads:
      max: 32
      min-spare: 4

spring:
  application:
    name: muse-any-connect
  datasource:
    url: ${MUSE_SQLITE_URL:jdbc:sqlite:${muse.data.sqlite-dir}/muse-connect.db?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&foreign_keys=ON}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      idle-timeout: 60000
      connection-test-query: SELECT 1
      pool-name: MuseSqlitePool
  sql:
    init:
      mode: always
  thymeleaf:
    cache: true

logging:
  file:
    name: ${muse.data.log-dir}/muse-any-connect.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

muse:
  data:
    dir: ${MUSE_DATA_DIR:./data}
    sqlite-dir: ${MUSE_SQLITE_DIR:${muse.data.dir}/sqlite}
    log-dir: ${MUSE_LOG_DIR:${muse.data.dir}/logs}
  relay:
    api-key: ${MUSE_RELAY_API_KEY:123456789}
    default-timeout-ms: ${MUSE_DEFAULT_TIMEOUT_MS:15000}
    activity-buffer-size: ${MUSE_ACTIVITY_BUFFER_SIZE:100}
  auth:
    username: ${MUSE_ADMIN_USERNAME:admin}
    password: ${MUSE_ADMIN_PASSWORD:123456}
    password-hash: ${MUSE_ADMIN_PASSWORD_HASH:}
    session-ttl-minutes: ${MUSE_AUTH_SESSION_TTL_MINUTES:720}
    max-failed-attempts: ${MUSE_AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${MUSE_AUTH_LOCKOUT_MINUTES:15}
    allow-raw-export: ${MUSE_ALLOW_RAW_EXPORT:true}
