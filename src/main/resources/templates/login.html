<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - MuseAnyConnect</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='20261128')}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span>MuseAnyConnect</span>
        <span class="brand-tag">HTTP Relay</span>
    </a>
</header>

<main class="login-wrap">
    <div class="card login-card">
        <div class="card-header" style="margin-bottom: 12px;">
            <h1 class="card-title" style="font-size: 1.2rem;">控制台管理员登录</h1>
        </div>
        <p class="muted" style="margin-top: 0; margin-bottom: 18px;">
            凭据由环境变量安全注入，会话仅驻留服务端内存（不写入 SQLite）。
        </p>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form id="loginForm" th:action="@{/login}" method="post" autocomplete="on">
            <input type="hidden" name="next" th:value="${next}">

            <div class="form-group">
                <label for="username">管理员账号</label>
                <input id="username" name="username" type="text" class="form-control"
                       th:value="${username}" autocomplete="username" required autofocus
                       placeholder="输入环境变量配置的管理员账号">
            </div>

            <div class="form-group">
                <label for="password">登录密码</label>
                <input id="password" name="password" type="password" class="form-control"
                       autocomplete="current-password" required
                       placeholder="输入登录密码">
            </div>

            <div class="login-options-row">
                <label class="checkbox-label" for="rememberCredentials">
                    <input id="rememberCredentials" type="checkbox">
                    <span>保存账号信息（浏览器本地缓存）</span>
                </label>
                <button id="clearSavedLoginBtn" type="button" class="link-btn hidden">清除缓存</button>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px 14px; margin-top: 6px;">
                登录控制台
            </button>
        </form>
    </div>
</main>

<script>
(function () {
    const STORAGE_KEY = 'muse_any_connect_login_cache_v1';
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberCheckbox = document.getElementById('rememberCredentials');
    const clearBtn = document.getElementById('clearSavedLoginBtn');

    function readCache() {
        try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
                return {
                    username: typeof parsed.username === 'string' ? parsed.username : '',
                    password: typeof parsed.password === 'string' ? parsed.password : ''
                };
            }
        } catch (ignored) {
            // 忽略格式损坏或不可用的 localStorage
        }
        return null;
    }

    function writeCache(username, password) {
        try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
                username: username || '',
                password: password || ''
            }));
        } catch (ignored) {
            // 忽略存储配额超限或隐私模式写入异常
        }
    }

    function clearCache() {
        try {
            window.localStorage.removeItem(STORAGE_KEY);
        } catch (ignored) {
            // 忽略不可用的 localStorage
        }
    }

    function syncClearBtn(hasCache) {
        if (clearBtn) {
            clearBtn.classList.toggle('hidden', !hasCache);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const cached = readCache();
        if (cached && (cached.username || cached.password)) {
            rememberCheckbox.checked = true;
            if (!usernameInput.value && cached.username) {
                usernameInput.value = cached.username;
            }
            if (!passwordInput.value && cached.password && usernameInput.value === cached.username) {
                passwordInput.value = cached.password;
            }
            syncClearBtn(true);
        } else {
            syncClearBtn(false);
        }
    });

    rememberCheckbox.addEventListener('change', function () {
        if (!rememberCheckbox.checked) {
            clearCache();
            syncClearBtn(false);
        }
    });

    clearBtn.addEventListener('click', function () {
        clearCache();
        rememberCheckbox.checked = false;
        usernameInput.value = '';
        passwordInput.value = '';
        syncClearBtn(false);
        usernameInput.focus();
    });

    form.addEventListener('submit', function () {
        if (rememberCheckbox.checked) {
            writeCache(usernameInput.value.trim(), passwordInput.value);
        } else {
            clearCache();
        }
    });
})();
</script>
</body>
</html>
